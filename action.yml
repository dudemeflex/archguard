name: ArchGuard
description: Enforce repository architecture rules for JavaScript and TypeScript
author: ArchGuard contributors

inputs:
  base:
    description: Base Git revision. Pull request base SHA is detected when omitted.
    required: false
  head:
    description: Head Git revision. Pull request head SHA is detected when omitted.
    required: false
  config:
    description: Repository-relative path to the ArchGuard configuration file
    required: false
    default: .archguard.yml
  baseline:
    description: Path to the ArchGuard baseline file
    required: false
  ignore-baseline:
    description: Ignore baseline and report all violations
    required: false
    default: "false"

runs:
  using: node20
  main: action-dist/index.js

branding:
  icon: shield
  color: blue
